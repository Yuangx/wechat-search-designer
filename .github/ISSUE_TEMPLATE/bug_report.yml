name: 问题反馈
description: 提交可复现的排版、输入或导出问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请使用虚构文章与账号，移除日志、截图和文件中的隐私。安全问题请先阅读 SECURITY.md。"
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      description: Skill 版本、系统、Node.js 和浏览器版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现
      description: 提供脱敏的设计输入、操作步骤与错误代码
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与期望结果
    validations:
      required: true
